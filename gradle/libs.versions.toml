[versions]
agp = "8.10.0"
androidx-lifecycle = "2.9.6"
composeMultiplatform = "1.10.0"
junit = "4.13.2"
kotlin = "2.3.20"
kotlinStdlib = "2.3.20"
runner = "1.5.2"
core = "1.5.0"
junitVersion = "1.1.5"
ktlint-gradle = "14.2.0"
navigation-compose = "2.9.2"
vanniktechMavenPublish = "0.30.0"
clikt = "5.1.0"
shadow = "9.0.0"
kotlinx-serialization = "1.8.1"
# Liquid glass effects (Android only — the KMP variants of this library require
# Compose Multiplatform 1.11, which is ahead of the 1.10 this project targets).
backdrop = "1.0.0"
# Swipe-to-reveal actions. Held at 1.2.0, the last release with an Android
# target: 1.3.0 converted to Compose Multiplatform and publishes common/iOS/JVM
# only, so it cannot be consumed from androidMain where the glass components live.
swipe = "1.2.0"
# Rounded-background and squiggly-underline span painters for AnnotatedString.
# Android only (aar). Depends on compose.ui + compose.foundation, no Material.
extendedspans = "1.4.0"
rikka-icons = "0.1.0"
# Sample app + screenshot verification (JVM/layoutlib, no emulator).
androidxActivity = "1.9.3"
# Matches triplex/apps/android so the composite build cannot skew Compose versions.
androidxComposeBom = "2025.10.01"
paparazzi = "2.0.0-alpha05"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlib" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
swipe = { module = "me.saket.swipe:swipe", version.ref = "swipe" }
extendedspans = { module = "me.saket.extendedspans:extendedspans", version.ref = "extendedspans" }
rikka-icons-core = { module = "dev.rikkaui.icons:core", version.ref = "rikka-icons" }
rikka-icons-tokens-core = { module = "dev.rikkaui.icons:tokens-core", version.ref = "rikka-icons" }
rikka-icons-pack-phosphor = { module = "dev.rikkaui.icons:pack-phosphor", version.ref = "rikka-icons" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
gradle-ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
vanniktechMavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
