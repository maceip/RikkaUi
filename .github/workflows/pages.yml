name: Build and deploy Compose gallery

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rikkaui-pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned, not latest: verifyPaparazziDebug compares against goldens recorded
    # on a maintainer's machine, so the runner's font rasterisation is part of
    # the contract. A silent image bump would surface as a snapshot failure with
    # no commit to blame, which is the worst way to learn about it.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gallery/package-lock.json

      # The gallery rasterizes this build immediately; production Binaryen -O3
      # adds several minutes without changing any captured pixels.
      - name: Build the Compose/Wasm capture application
        run: ./gradlew :composeApp:wasmJsBrowserDevelopmentExecutableDistribution --no-daemon

      # Verify rather than record: the committed goldens are what the gallery
      # publishes, so a drifted snapshot has to fail the build instead of being
      # silently overwritten by the run that consumes it.
      - name: Verify Android component bitmaps
        run: ./gradlew :sample:verifyPaparazziDebug --no-daemon --no-configuration-cache

      - name: Install the gallery renderer
        working-directory: gallery
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Capture Compose components and assemble the gallery
        run: |
          mkdir -p build/gallery-site/app
          cp -R composeApp/build/dist/wasmJs/developmentExecutable/. build/gallery-site/app/
          python3 -m http.server 4173 --directory build/gallery-site/app >/tmp/rikkaui-gallery-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node gallery/render-gallery.mjs \
            --base-url http://127.0.0.1:4173 \
            --site-dir build/gallery-site \
            --registry feature/docs/src/commonMain/kotlin/zed/rainxch/rikkaui/docs/catalog/ComponentRegistry.kt \
            --android-snapshots sample/src/test/snapshots/images
          cp gallery/gallery.css build/gallery-site/assets/gallery.css
          cp gallery/gallery.js build/gallery-site/assets/gallery.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/gallery-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
